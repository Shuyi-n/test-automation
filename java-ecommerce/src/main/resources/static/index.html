<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人货场 · 电商实时数据大屏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #04080f;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            background-image: url('/images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center,
            rgba(0, 0, 0, 0.15) 0%,
            rgba(0, 0, 0, 0.55) 70%,
            rgba(0, 0, 0, 0.80) 100%);
            pointer-events: none;
        }
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                    linear-gradient(rgba(0, 180, 240, 0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 180, 240, 0.05) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        .welcome-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
        }

        .welcome-sub {
            font-size: 14px;
            letter-spacing: 6px;
            color: rgba(0, 234, 255, 0.65);
            margin-bottom: 22px;
            text-shadow: 0 0 10px rgba(0, 234, 255, 0.45);
        }

        .welcome-title {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 12px;
            color: #ffffff;
            margin-bottom: 18px;
            text-shadow:
                    0 0 18px rgba(0, 234, 255, 0.65),
                    0 0 42px rgba(0, 180, 240, 0.35);
        }

        .welcome-line {
            width: 460px;
            height: 1px;
            margin-bottom: 26px;
            background: linear-gradient(90deg,
            transparent 0%,
            rgba(0, 234, 255, 0.85) 50%,
            transparent 100%);
            box-shadow: 0 0 12px rgba(0, 234, 255, 0.55);
        }

        .welcome-desc {
            font-size: 15px;
            letter-spacing: 3px;
            color: rgba(180, 220, 255, 0.75);
            margin-bottom: 56px;
        }

        .enter-btn {
            display: inline-block;
            padding: 14px 54px;
            font-size: 17px;
            letter-spacing: 6px;
            color: #00eaff;
            text-decoration: none;
            border: 1px solid rgba(0, 234, 255, 0.55);
            border-radius: 4px;
            background: linear-gradient(180deg,
            rgba(0, 234, 255, 0.10) 0%,
            rgba(0, 90, 220, 0.10) 100%);
            box-shadow:
                    0 0 18px rgba(0, 234, 255, 0.28),
                    0 0 6px rgba(0, 234, 255, 0.25) inset;
            transition: all 0.35s ease;
            position: relative;
        }
        .enter-btn:hover {
            color: #ffffff;
            border-color: rgba(0, 234, 255, 0.95);
            background: linear-gradient(180deg,
            rgba(0, 234, 255, 0.22) 0%,
            rgba(0, 90, 220, 0.22) 100%);
            box-shadow:
                    0 0 32px rgba(0, 234, 255, 0.65),
                    0 0 12px rgba(0, 234, 255, 0.45) inset;
            transform: translateY(-2px);
        }

        .welcome-footer {
            position: absolute;
            bottom: 28px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            letter-spacing: 3px;
            color: rgba(140, 180, 220, 0.45);
            z-index: 10;
        }

        .deco-bin {
            position: absolute;
            top: 40px;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(0, 234, 255, 0.22);
            user-select: none;
            z-index: 5;
        }
        .deco-bin.left  { left: 40px; }
        .deco-bin.right { right: 40px; }
    </style>
</head>
<body>

<div class="deco-bin left">1011010010111010101</div>
<div class="deco-bin right">10101001011110100101</div>

<div class="welcome-wrap">

    <div class="welcome-sub">REAL-TIME E-COMMERCE DASHBOARD</div>

    <div class="welcome-title">人货场 · 电商实时数据大屏</div>

    <div class="welcome-line"></div>

    <div class="welcome-desc">
        Display the data of the training project
    </div>

    <a class="enter-btn" href="/dashboard.html">进入大屏</a>

</div>

<div class="welcome-footer">
    © 实时电商数据大屏 · 实训答辩项目
</div>

</body>
</html>
